name: Import GymFit clean snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout new portfolio repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone verified GymFit source snapshot
        run: |
          git clone https://github.com/EinnUlfr01/Web-GYM.git /tmp/gymfit-source
          cd /tmp/gymfit-source
          git checkout 3debfcd1b1ec2f684801432ee78e59e8f7cd619a
          rm -rf .git

      - name: Replace repository contents without old Git history
        shell: bash
        run: |
          shopt -s dotglob nullglob
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/gymfit-source/. "$GITHUB_WORKSPACE/"

          # Portfolio hygiene: remove generated/cache artifacts if tracked in the old snapshot.
          find "$GITHUB_WORKSPACE" -type d \( -name node_modules -o -name __pycache__ -o -name dist -o -name build \) -prune -exec rm -rf {} + || true
          find "$GITHUB_WORKSPACE" -type f \( -name '*.pyc' -o -name '.env' -o -name '.env.local' -o -name '.env.production' \) -delete || true

          # Remove this one-time importer if the source snapshot did not overwrite it already.
          rm -f "$GITHUB_WORKSPACE/.github/workflows/import-gymfit-snapshot.yml"

      - name: Normalize legacy repository references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          replacements = {
              'https://github.com/EinnUlfr01/Web-GYM': 'https://github.com/vinh17491/GymFit',
              'EinnUlfr01/Web-GYM': 'vinh17491/GymFit',
          }

          text_exts = {
              '.md', '.txt', '.json', '.yml', '.yaml', '.ts', '.tsx', '.js', '.jsx',
              '.sql', '.css', '.scss', '.html', '.xml', '.env', '.example', '.cjs', '.mjs'
          }

          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              if p.suffix.lower() not in text_exts and p.name not in {'Dockerfile', '.gitignore', '.gitattributes', '.editorconfig'}:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              new = s
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != s:
                  p.write_text(new, encoding='utf-8')
          PY

      - name: Commit clean snapshot as vinh17491
        shell: bash
        run: |
          git config user.name "vinh17491"
          git config user.email "194791583+vinh17491@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "feat: import GymFit clean portfolio snapshot"
          git push origin main
